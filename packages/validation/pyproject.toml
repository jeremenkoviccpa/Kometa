[project]
name = "autotrader-validation"
version = "0.1.0"
description = "Walk-forward, holdout, Monte Carlo, DSR, reports."
requires-python = ">=3.12,<3.13"
dependencies = ["autotrader-core", "autotrader-engine", "autotrader-data", "autotrader-strategies-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
autotrader-engine = { workspace = true }
autotrader-data = { workspace = true }
autotrader-strategies-api = { workspace = true }
