[project]
name = "autotrader-api"
version = "0.1.0"
description = "FastAPI status and owner control service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotrader-core",
    "autotrader-lifecycle",
    "autotrader-monitor",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
autotrader-monitor = { workspace = true }
autotrader-lifecycle = { workspace = true }
