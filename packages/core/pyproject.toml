[project]
name = "autotrader-core"
version = "0.1.0"
description = "Domain models, clock, events, indicators, utils. Depends on nothing internal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=2.0",
    "cryptography>=43",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]
