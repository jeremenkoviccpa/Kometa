[project]
name = "autotrader-data"
version = "0.1.0"
description = "Ingestion, storage, quality checks, calendar, swaps."
requires-python = ">=3.12,<3.13"
dependencies = ["polars>=1.10", "pyyaml>=6", "pydantic-settings>=2.5", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13", "httpx>=0.27", "autotrader-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
