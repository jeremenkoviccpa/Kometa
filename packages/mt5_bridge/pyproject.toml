[project]
name = "autotrader-mt5-bridge"
version = "0.1.0"
description = "Runs on Windows next to the MT5 terminal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotrader-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
