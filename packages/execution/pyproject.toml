[project]
name = "autotrader-execution"
version = "0.1.0"
description = "Broker adapters, order manager, reconciliation, watchdog."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotrader-core",
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
