[project]
name = "autotrader-risk"
version = "0.1.0"
description = "Risk gate service. Separate package, separate owner."
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6", "autotrader-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
