[project]
name = "autotrader-allocator"
version = "0.1.0"
description = "Risk budget allocation across strategy versions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotrader-core",
    "numpy>=2.0",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
