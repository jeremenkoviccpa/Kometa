[project]
name = "autotrader-monitor"
version = "0.1.0"
description = "Alerts, daily summaries, audit writer."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotrader-core",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
