[project]
name = "autotrader-research"
version = "0.1.0"
description = "Claude research agents, prompts, trial registry, knowledge base."
requires-python = ">=3.12,<3.13"
dependencies = ["autotrader-core", "autotrader-lifecycle"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
autotrader-lifecycle = { workspace = true }
