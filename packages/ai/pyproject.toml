[project]
name = "autotrader-ai"
version = "0.1.0"
description = "The owner's Claude trading tracks (demo/paper only, every trade through the risk gate)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotrader-core",
    "autotrader-engine",
    "autotrader-strategies-api",
    "anthropic>=0.60",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
autotrader-engine = { workspace = true }
autotrader-strategies-api = { workspace = true }
