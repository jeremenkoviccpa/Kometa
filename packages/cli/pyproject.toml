[project]
name = "autotrader-cli"
version = "0.1.0"
description = "The `at` command line tool."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotrader-core",
    "autotrader-data",
    "autotrader-engine",
    "autotrader-strategies-api",
    "autotrader-validation",
    "autotrader-risk",
    "autotrader-execution",
    "autotrader-lifecycle",
    "autotrader-allocator",
    "autotrader-api",
    "autotrader-monitor",
    "uvicorn>=0.30",
]

[project.scripts]
at = "autotrader.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.uv.sources]
autotrader-core = { workspace = true }
autotrader-data = { workspace = true }
autotrader-engine = { workspace = true }
autotrader-strategies-api = { workspace = true }
autotrader-validation = { workspace = true }
autotrader-risk = { workspace = true }
autotrader-execution = { workspace = true }
autotrader-lifecycle = { workspace = true }
autotrader-allocator = { workspace = true }
autotrader-api = { workspace = true }
autotrader-monitor = { workspace = true }
