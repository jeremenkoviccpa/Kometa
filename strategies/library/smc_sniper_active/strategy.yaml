# CANDIDATE strategy (owner decision 2026-09-26). Not validated; trades money only after validation, shadow
# and micro say so. The owner's SMC sniper method with four of its strictest requirements relaxed, so it
# trades often enough to judge (strategy.py is the smc_sniper file; the switches below are the difference).
id: smc_sniper_active
version: 1.0.0
origin: owner
family: smc_top_down
symbols: [XAUUSD]
timeframes: [M1, M5, M15, H1, H4, D1]
params:
  disp_atr: {value: 1.5, min: 1.0, max: 3.0, tunable: true}
  window_m: {value: 90, min: 30, max: 240, tunable: true}
  max_sl_atr: {value: 1.0, min: 0.3, max: 2.0, tunable: true}
  stop_buffer_atr: {value: 0.3, min: 0.0, max: 1.0, tunable: true}
  liq_lookback: {value: 20, min: 10, max: 60, tunable: true}
  min_rr: {value: 3.0, min: 3.0, max: 5.0, tunable: false}
  require_d1: {value: false}
  m15_poi: {value: true}
  require_m5: {value: false}
  require_bos: {value: false}
expected:
  trades_per_month: 6
  win_rate: 0.25
  avg_r: 0.10
description: >-
  The SMC sniper method, more active: H4 bias (D1 not against it), POI from an H1 or M15 order block with a
  fair value gap in discount/premium, no separate M5 step, and the displacement CHOCH counts as the break.
  Still required: liquidity sweep with rejection, CHOCH by a displacement candle leaving an FVG, pullback
  into the gap with a pin bar or engulfing, stop beyond the sweep, target at the nearest real liquidity, 3R.
