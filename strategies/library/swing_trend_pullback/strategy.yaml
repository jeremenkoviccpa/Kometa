id: swing_trend_pullback
version: 1.0.0
origin: owner
family: swing_trend_pullback
symbols: [XAUUSD]
timeframes: [H4, D1]
params:
  trend_len: {value: 50, min: 20, max: 150, tunable: true}
  pullback_ema: {value: 20, min: 10, max: 50, tunable: true}
  pullback_atr: {value: 0.5, min: 0.0, max: 1.5, tunable: true}
