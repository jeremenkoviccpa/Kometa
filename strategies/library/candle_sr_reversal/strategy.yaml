# CANDIDATE strategy (owner decision 2026-09-25). Not validated; trades money only after validation, shadow
# and micro say so. Classic price action (reversal candles at support and resistance). The pattern definitions
# are the MIT-licensed cm45t3r/candlestick set (core.indicators.candlestick, see THIRD_PARTY_NOTICES.md).
# 1.0.0 used pin bar, engulfing and star only (docs/research_log.md).
id: candle_sr_reversal
version: 1.1.0
origin: owner
family: candle_price_action
symbols: [XAUUSD]
timeframes: [H1, H4]
params:
  min_touches: {value: 2, min: 1, max: 4, tunable: true}
  zone_atr: {value: 0.3, min: 0.1, max: 0.8, tunable: true}
  stop_buffer_atr: {value: 0.2, min: 0.05, max: 1.0, tunable: true}
  min_rr: {value: 1.5, min: 1.0, max: 3.0, tunable: true}
  level_k: {value: 0.5, min: 0.25, max: 1.0, tunable: true}
  max_rr: {value: 4.0, min: 2.0, max: 6.0, tunable: false}
  with_trend: {value: true}
expected:
  trades_per_month: 4
  win_rate: 0.45
  avg_r: 0.10
description: >-
  Classic candlestick reversals (the full set ported from cm45t3r/candlestick: hammer, engulfing, harami,
  piercing line / dark cloud cover, tweezers, stars, kickers) at tested H4 support and resistance, with the
  H4 trend, stop beyond the candle, target at the next opposite level if it offers at least 1.5R.
