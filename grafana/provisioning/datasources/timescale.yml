apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: autotrader_readonly   # SELECT only (migration 0006); login set by `make db-roles`
    jsonData:
      database: autotrader
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    secureJsonData:
      password: $__file{/run/secrets/db_readonly_password}
